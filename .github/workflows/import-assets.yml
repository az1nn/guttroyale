name: Import site assets

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  import-assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download original Gutt Royale assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/comercialestilodevet-create/guttroyale/main"
          curl --fail --location --retry 3 "$base/prince-gutt.png" -o prince-gutt.png
          curl --fail --location --retry 3 "$base/gutt-royale-logo-final.png" -o gutt-royale-logo-final.png
          curl --fail --location --retry 3 "$base/cpx-labs.png" -o cpx-labs.png
          curl --fail --location --retry 3 "$base/vida-dura.png" -o vida-dura.png
          test -s prince-gutt.png
          test -s gutt-royale-logo-final.png
          test -s cpx-labs.png
          test -s vida-dura.png

      - name: Localize asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          raw = "https://raw.githubusercontent.com/comercialestilodevet-create/guttroyale/main/"
          html = Path("index.html").read_text(encoding="utf-8")
          css = Path("style.css").read_text(encoding="utf-8")
          for name in ("prince-gutt.png","gutt-royale-logo-final.png","cpx-labs.png","vida-dura.png"):
              html = html.replace(raw + name, name)
              css = css.replace(raw + name, name)
          Path("index.html").write_text(html, encoding="utf-8")
          Path("style.css").write_text(css, encoding="utf-8")
          PY

      - name: Commit imported assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css prince-gutt.png gutt-royale-logo-final.png cpx-labs.png vida-dura.png
          git commit -m "chore: localize Gutt Royale assets"
          git push
